# The installers: the desktop build packaged with its own Electron.
# Each package carries its host architecture's node-pty binary.
appId: is.n10.desktop
# Not `n10`, which is the npm package's command (`n10 --tui`, `n10 util`).
executableName: n10-desktop
copyright: Copyright © 2026 Hermann Björgvin
directories:
  app: dist/installer-app
  output: dist/installers
  buildResources: build
# Rebuild native dependencies against the packaged Electron runtime.
npmRebuild: true
# Run by other processes, which cannot read inside the archive: node-pty's
# addon, and beam, which sessions reach through a symlink.
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@notaharness/beam-*/**
win:
  target:
    - nsis
  # electron-builder uses build/icon.ico for the app and NSIS installer.
  # An isolated checkout without the asset gets its default icon.
nsis:
  artifactName: n10-desktop-x64.exe
  oneClick: false
  perMachine: false
  selectPerMachineByDefault: false
  createStartMenuShortcut: true
  createDesktopShortcut: true
  shortcutName: n10 Desktop
linux:
  target:
    - deb
    - AppImage
  category: Development
  synopsis: Coding agents in git worktrees, and reviews of their pull requests
  maintainer: notaharness <notaharness@users.noreply.github.com>
  vendor: notaharness
  syncDesktopName: true
# Versionless release asset names (docs/decisions.md). Keep
# release-assets.json in step: the release uploads the files it names.
appImage:
  artifactName: n10-desktop-${arch}.AppImage
# The default FUSE2 runtime needs an unversioned libz.so on arm64. The static
# runtime avoids that symlink and libfuse2; normal launch still needs FUSE 3.
toolsets:
  appimage: '1.0.3'
deb:
  artifactName: n10-desktop_${arch}.deb
  # electron-builder's defaults, which setting depends replaces, then
  # the ALSA library Electron links, which minimal systems lack (named
  # first, so apt does not pick an ALSA emulation), and what n10 runs.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
    - tmux (>= 3.2)
    - git
