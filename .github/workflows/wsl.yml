name: WSL2

# The offline TUI and desktop suites inside a real WSL2 distro on a hosted
# Windows runner, and n10 Desktop launched sandboxed on WSLg's display.
# GitHub documents nested virtualization on its runners as possible but
# unsupported, so a run that cannot boot WSL2 fails here rather than
# falling back to WSL1 or passing without coverage.

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DISTRO: n10-ci
  ROOTFS: https://cloud-images.ubuntu.com/wsl/releases/24.04/current
  ROOTFS_FILE: ubuntu-noble-wsl-amd64-24.04lts.rootfs.tar.gz
  # wsl.exe otherwise writes UTF-16, which the log shows as spaced-out text.
  WSL_UTF8: '1'

jobs:
  e2e:
    name: ${{ matrix.suite }}-e2e in WSL2
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        suite: [cli, desktop]
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      # The scripts run under Linux bash; a CRLF checkout would break them.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Report the runner's WSL
        run: |
          wsl --version
          wsl --status

      - name: Import Ubuntu 24.04 as a WSL2 distro
        run: |
          $dir = "$env:RUNNER_TEMP\wsl"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest "$env:ROOTFS/$env:ROOTFS_FILE" -OutFile "$dir\$env:ROOTFS_FILE"
          Invoke-WebRequest "$env:ROOTFS/SHA256SUMS" -OutFile "$dir\SHA256SUMS"
          $expected = (Select-String -Path "$dir\SHA256SUMS" -Pattern " \*?$([regex]::Escape($env:ROOTFS_FILE))$").Line.Split(' ')[0]
          $actual = (Get-FileHash "$dir\$env:ROOTFS_FILE" -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "rootfs checksum mismatch: $actual, expected $expected" }
          wsl --import $env:DISTRO "$dir\$env:DISTRO" "$dir\$env:ROOTFS_FILE" --version 2
          if ($LASTEXITCODE -ne 0) { throw "wsl --import exited $LASTEXITCODE" }
          wsl --list --verbose

      - name: Require a booted WSL2 kernel
        run: |
          wsl -d $env:DISTRO --cd $env:GITHUB_WORKSPACE -- bash tools/wsl/probe.sh
          if ($LASTEXITCODE -ne 0) { throw "probe exited $LASTEXITCODE" }

      - name: Provision the distro
        run: |
          wsl -d $env:DISTRO -u root --cd $env:GITHUB_WORKSPACE -- bash tools/wsl/provision.sh n10 24 .
          if ($LASTEXITCODE -ne 0) { throw "provision exited $LASTEXITCODE" }
          wsl --terminate $env:DISTRO

      # What the Windows docs describe: a tmux session outlives the
      # terminal that started it.
      - name: Session lifetime in WSL2
        if: matrix.suite == 'cli'
        run: ./tools/wsl/session-lifetime.ps1 -Distro $env:DISTRO -User n10

      - name: ${{ matrix.suite }}-e2e in WSL2
        run: |
          wsl -d $env:DISTRO -u n10 --cd $env:GITHUB_WORKSPACE -- bash tools/wsl/run-e2e.sh ${{ matrix.suite }}
          if ($LASTEXITCODE -ne 0) { throw "run-e2e exited $LASTEXITCODE" }

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wsl-${{ matrix.suite }}-test-output
          path: wsl-test-output
          if-no-files-found: ignore
          retention-days: 7
