name: Deploy website

on:
  push:
    branches:
      - master

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - uses: nrwl/nx-set-shas@v4

      # Builds, checks the desktop demo made it into the assets, and
      # dry-runs wrangler; needs no credentials.
      - run: npx nx affected -t deploy:check

      # Needs the CLOUDFLARE_API_TOKEN repository secret and the
      # CLOUDFLARE_ACCOUNT_ID repository variable — see apps/website/README.md.
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx nx affected -t deploy
