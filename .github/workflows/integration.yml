name: Integration Tests

# The live suites: both shells against real GitHub through a dedicated
# fixture repository and INTEGRATION_TEST_PAT. They mostly verify GitHub
# as a vendor, so they run nightly on master and on manual dispatch, not
# on pull requests; no pull request check needs a secret. A nightly
# failure opens (or comments on) one tracking issue, and the next passing
# nightly closes it.

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

concurrency:
  group: integration-tests
  cancel-in-progress: false # test repo is shared state — queue, don't cancel

permissions:
  contents: read

jobs:
  integration:
    name: Live GitHub integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - uses: ./.github/actions/setup-e2e
        with:
          chromium: 'true'

      - name: Verify gh CLI auth
        env:
          GH_TOKEN: ${{ secrets.INTEGRATION_TEST_PAT }}
        run: gh auth status

      - name: Build CLI
        run: npx nx build cli

      - name: Run e2e tests (including integration)
        run: npx nx e2e:integration cli-e2e
        env:
          GH_TOKEN: ${{ secrets.INTEGRATION_TEST_PAT }}
          TEST_REPO: ${{ vars.TEST_REPO || 'kirby-test-runner/kirby-integration-test-repository' }}
          # Wire n10's logger to the file the "Upload debug logs"
          # step below already publishes. cli-wterm-host forwards
          # process.env into every spawned n10 PTY
          # (apps/cli-wterm-host/src/main.ts:70), so this lands in
          # every test's n10 instance with no fixture changes.
          N10_LOG: /tmp/n10-integ-debug.log
          N10_LOG_LEVEL: debug

      - name: Run desktop e2e tests (including integration)
        run: npx nx e2e:integration desktop-e2e
        env:
          GH_TOKEN: ${{ secrets.INTEGRATION_TEST_PAT }}
          TEST_REPO: ${{ vars.TEST_REPO || 'kirby-test-runner/kirby-integration-test-repository' }}

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n10-debug-logs
          path: /tmp/n10-integ-debug.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-output-integration
          path: |
            apps/cli-e2e/test-output
            apps/desktop-e2e/test-output
          if-no-files-found: ignore
          retention-days: 7

  # Scheduled runs and dispatches on master only, so a dispatch on a
  # topic branch never files an issue. A cancelled run says nothing
  # either way and is left alone.
  track:
    name: Track the nightly result
    needs: integration
    if: >-
      always() && github.ref == 'refs/heads/master' &&
      (needs.integration.result == 'success' || needs.integration.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.integration.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Nightly live integration tests are failing
        run: |
          issue=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == env.TITLE)) | first | .number // empty")
          if [ "$RESULT" = failure ]; then
            body="Failed on \`$GITHUB_SHA\`: $RUN_URL"
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "$body"
            else
              gh issue create --title "$TITLE" --body "$body

          The nightly live GitHub integration run (\`.github/workflows/integration.yml\`) failed. Its artifacts hold the n10 debug log and Playwright traces. The next passing nightly closes this issue."
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Passed on \`$GITHUB_SHA\`: $RUN_URL"
          fi
