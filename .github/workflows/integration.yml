name: Integration Tests

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'apps/cli/**'
      - 'libs/**'
      - 'apps/cli-e2e/**'
      - 'apps/cli-wterm-host/**'
      - 'apps/desktop/**'
      - 'apps/desktop-e2e/**'
      - '.github/workflows/integration.yml'
  workflow_dispatch:

concurrency:
  group: integration-tests
  cancel-in-progress: false # test repo is shared state — queue, don't cancel

permissions:
  actions: read
  contents: read

jobs:
  fork-notice:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Explain live integration coverage
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Live integration skipped for this fork

          These tests need a maintainer-owned GitHub fixture repository and
          `INTEGRATION_TEST_PAT`, which is not available to fork pull requests.
          You do not need to supply a token. The required `main` check runs
          without this secret.

          A maintainer's run on `master` covers live integration after merge.
          This pull request's live integration tests have not run.
          EOF

  integration:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Electron otherwise downloads its binary on the first e2e launch,
      # inside Playwright's launch timeout.
      - run: npx --no install-electron

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify gh CLI auth
        env:
          GH_TOKEN: ${{ secrets.INTEGRATION_TEST_PAT }}
        run: gh auth status

      # desktop-e2e drives the real Electron app, which needs a display.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # The tmux both e2e suites run against (docs/testing.md).
      - uses: ./.github/actions/setup-tmux

      - name: Build CLI
        run: npx nx build cli

      - name: Run e2e tests (including integration)
        run: npx nx e2e:integration cli-e2e
        env:
          GH_TOKEN: ${{ secrets.INTEGRATION_TEST_PAT }}
          TEST_REPO: ${{ vars.TEST_REPO || 'kirby-test-runner/kirby-integration-test-repository' }}
          # Wire n10's logger to the file the "Upload debug logs"
          # step below already publishes. cli-wterm-host forwards
          # process.env into every spawned n10 PTY
          # (apps/cli-wterm-host/src/main.ts:70), so this lands in
          # every test's n10 instance with no fixture changes.
          N10_LOG: /tmp/n10-integ-debug.log
          N10_LOG_LEVEL: debug

      - name: Run desktop e2e tests (including integration)
        run: npx nx e2e:integration desktop-e2e
        env:
          GH_TOKEN: ${{ secrets.INTEGRATION_TEST_PAT }}
          TEST_REPO: ${{ vars.TEST_REPO || 'kirby-test-runner/kirby-integration-test-repository' }}

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n10-debug-logs
          path: /tmp/n10-integ-debug.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-output-integration
          path: |
            apps/cli-e2e/test-output
            apps/desktop-e2e/test-output
          if-no-files-found: ignore
          retention-days: 7
