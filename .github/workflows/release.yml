name: Release

# A vX.Y.Z tag releases X.Y.Z: it packs and tests the npm package and builds
# the Linux installers on x64 and arm64, publishes the tarball to npm through
# trusted publishing, and creates the GitHub release with those installers.
# A prerelease (vX.Y.Z-beta.N) goes under npm's `beta` dist-tag,
# goes under npm's `beta` dist-tag, and `latest` too while LATEST_FOLLOWS_BETA
# is true; any other version goes under `latest`.
# Run by hand, it rehearses the release of the selected ref's version:
# the same builds, with npm publish --dry-run and no GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

env:
  # n10 is beta-only, so a plain `npm install` must get the newest beta:
  # while this is true, a prerelease moves `latest` as well as `beta`. Set it
  # to false at 1.0, so `latest` stays on stable releases.
  LATEST_FOLLOWS_BETA: true

concurrency:
  group: release

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.version.outputs.name }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
      move-latest: ${{ steps.version.outputs.move-latest }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          name=$(node -p 'require("./apps/cli/package.json").name')
          version=$(node -p 'require("./apps/cli/package.json").version')
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match apps/cli/package.json's $version"
            exit 1
          fi
          case $version in
            *-*) prerelease=true dist_tag=beta move_latest=$LATEST_FOLLOWS_BETA ;;
            *) prerelease=false dist_tag=latest move_latest=false ;;
          esac
          {
            echo "name=$name"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "dist-tag=$dist_tag"
            echo "move-latest=$move_latest"
          } >> "$GITHUB_OUTPUT"
          echo "$name@$version: dist-tag $dist_tag, moves latest $move_latest, GitHub prerelease $prerelease"

  package:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml

  linux-packages:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/linux-packages.yml

  # Its own job, so a GitHub release that fails after publishing can be
  # re-run alone.
  publish:
    if: github.event_name == 'push'
    needs: [version, package, linux-packages]
    runs-on: ubuntu-latest
    # Its deployment rule admits only v* tags; npm's trusted publisher names it.
    environment: npm
    permissions:
      id-token: write # trusted publishing and provenance
    env:
      PACKAGE: ${{ needs.version.outputs.name }}
      VERSION: ${{ needs.version.outputs.version }}
      DIST_TAG: ${{ needs.version.outputs.dist-tag }}
      MOVE_LATEST: ${{ needs.version.outputs.move-latest }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # npm dist-tag authenticates through trusted publishing from 11.21.0.
      - run: npm install -g npm@11.21.0
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: package
      # A re-run after a failure past the publish finishes the dist-tags only.
      - id: published
        name: whether this version is already on npm
        run: |
          if [ "$(npm view "$PACKAGE@$VERSION" version 2> /dev/null)" = "$VERSION" ]; then
            echo "$PACKAGE@$VERSION is already published"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi
      # npm publish exchanges the job's OIDC token even in a dry run, and logs
      # whether the trusted publisher took it, so a misconfigured publisher
      # fails here with npm's reason instead of at the publish.
      - if: steps.published.outputs.done != 'true'
        name: npm takes this workflow as the trusted publisher
        run: |
          npm publish --dry-run --loglevel verbose --tag "$DIST_TAG" ./package/*.tgz 2> npm.log || { cat npm.log; exit 1; }
          grep -q 'oidc Successfully retrieved and set token' npm.log || { grep oidc npm.log || true; echo "::error::npm's trusted publisher for this package did not take this workflow"; exit 1; }
      # npm checks the publisher's "Allow npm dist-tag" when a tag changes, and
      # dist-tag add skips the request when the tag already has the version, so
      # the check sets and removes a tag of its own.
      - if: env.MOVE_LATEST == 'true'
        name: npm lets this workflow change dist-tags
        run: |
          current=$(npm view "$PACKAGE" dist-tags.latest)
          npm dist-tag add "$PACKAGE@$current" release-check
          npm dist-tag rm "$PACKAGE" release-check
      - if: steps.published.outputs.done != 'true'
        run: npm publish --provenance --tag "$DIST_TAG" ./package/*.tgz
      - if: env.MOVE_LATEST == 'true'
        run: npm dist-tag add "$PACKAGE@$VERSION" latest

  # A dispatched rehearsal: outside the tag-only environment, with no token,
  # so it cannot check the trusted publisher.
  rehearse:
    if: github.event_name == 'workflow_dispatch'
    needs: [version, package, linux-packages]
    runs-on: ubuntu-latest
    env:
      DIST_TAG: ${{ needs.version.outputs.dist-tag }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: package
      - run: npm publish --dry-run --tag "$DIST_TAG" ./package/*.tgz

  # Attach every file release-assets.json names from release-* artifacts,
  # plus the manifest itself so the release records its download names.
  github-release:
    if: github.event_name == 'push'
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/desktop/release-assets.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - run: |
          manifest=apps/desktop/release-assets.json
          assets=("$manifest")
          for name in $(jq -er '.[][][]' "$manifest"); do
            [ -f "assets/$name" ] || { echo "::error::$name was not built"; exit 1; }
            assets+=("assets/$name")
          done
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --prerelease="$PRERELEASE" "${assets[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
