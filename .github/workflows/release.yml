name: Release

# A vX.Y.Z tag releases X.Y.Z: it packs and tests the npm package
# (package.yml) and builds the Linux packages (linux-packages.yml), publishes
# that tarball to npm through trusted publishing, and creates the GitHub
# release with the Linux packages attached.
# Run by hand, it rehearses the release of the selected ref's version: the
# same builds, and npm publish with --dry-run; nothing is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: |
          version=$(node -p 'require("./apps/cli/package.json").version')
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match apps/cli/package.json's $version"
            exit 1
          fi

  package:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml

  linux-packages:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/linux-packages.yml

  # Its own job, so a GitHub release that fails after publishing can be
  # re-run alone. Why only `latest`: publish-beta's packaging notes.
  publish:
    if: github.event_name == 'push'
    needs: [package, linux-packages]
    runs-on: ubuntu-latest
    # Its deployment rule admits only v* tags; npm's trusted publisher names it.
    environment: npm
    permissions:
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # its npm (11.5.1 or later) supports trusted publishing
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: package
      - run: npm publish --provenance --tag latest package/*.tgz

  # A dispatched rehearsal: outside the tag-only environment, with no token.
  rehearse:
    if: github.event_name == 'workflow_dispatch'
    needs: [package, linux-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: package
      - run: npm publish --dry-run --tag latest package/*.tgz

  # Attaches every file release-assets.json names, which must all have
  # arrived as release-* artifacts, and the manifest itself, so
  # releases/latest/download/release-assets.json lists the assets beside it.
  # Never a prerelease: one channel during the beta (docs/decisions.md).
  github-release:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/desktop/release-assets.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - run: |
          manifest=apps/desktop/release-assets.json
          assets=("$manifest")
          for name in $(jq -er '.[][][]' "$manifest"); do
            [ -f "assets/$name" ] || { echo "::error::$name was not built"; exit 1; }
            assets+=("assets/$name")
          done
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --latest "${assets[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
