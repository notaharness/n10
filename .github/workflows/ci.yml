name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Electron otherwise downloads its binary on the first e2e launch,
      # inside Playwright's launch timeout.
      - run: npx --no install-electron

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # xvfb: desktop-e2e drives the real Electron app, which has no
      # headless mode of its own and needs an X server on the runner.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # tmux is required by the tmux, core and both application e2e
      # suites, which run against 3.7 (docs/testing.md).
      - uses: ./.github/actions/setup-tmux

      - uses: nrwl/nx-set-shas@v4

      # `e2e:visual` runs the screenshot suite inside a pinned container
      # (see apps/desktop-e2e/run-visual.mjs). Baselines are generated in
      # that same image, so the runner's own fonts never enter into it
      # and the comparison can hold at zero tolerance.
      - run: npx nx affected -t lint test build typecheck e2e e2e:visual

      # The app against real beam daemons (apps/desktop-e2e/run-beam-e2e.mjs),
      # after the offline suite rather than beside it on the same X server.
      - run: npx nx affected -t e2e:beam

      # The desktop e2e targets land under `apps/desktop-e2e/test-output`,
      # each in its own subdirectory (`playwright/` for the offline suite,
      # `visual/` for the screenshot suite, `beam/` for the beam suite),
      # so a failing screenshot's expected/actual/diff PNGs travel with
      # the offline suite's traces instead of one run erasing another's.
      - name: Upload Playwright test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-output
          path: |
            apps/cli-e2e/test-output
            apps/desktop-e2e/test-output
          if-no-files-found: ignore
          retention-days: 7

  # Without tmux the session host owns its sessions. The offline suite,
  # minus `@tmux` tests, runs again with tmux hidden from the app's PATH
  # (docs/testing.md).
  no-tmux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - run: npx --no install-electron

      # cli-e2e drives the TUI in Chromium through its wterm host.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - uses: nrwl/nx-set-shas@v4

      - run: npx nx affected -t e2e:no-tmux

      - name: Upload Playwright test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: no-tmux-test-output
          path: |
            apps/desktop-e2e/test-output/no-tmux
            apps/cli-e2e/test-output/no-tmux
          if-no-files-found: ignore
          retention-days: 7

  # Windows viability: the session host's job and ConPTY under real
  # Electron, and the mux pipe's authentication, including against a
  # second local account (docs/design/windows-support.md).
  windows:
    runs-on: windows-2022
    env:
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - run: npx --no install-electron

      - run: npx nx run-many -t typecheck -p @n10/terminal-pty @n10/core desktop-e2e

      - run: npx nx test @n10/core -- src/lib/mux

      # A standard account for the separate-user test. The runner is
      # already elevated. A failure here fails the job: the test never
      # silently skips in CI.
      - name: Create a second local account
        shell: pwsh
        run: |
          $name = "n10e2e$(Get-Random -Minimum 10000 -Maximum 99999)"
          $bytes = [byte[]]::new(24)
          [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $password = "$([Convert]::ToBase64String($bytes))aA1!"
          Write-Output "::add-mask::$password"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $name -Password $secure -AccountNeverExpires -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group Users -Member $name
          "N10_E2E_OTHER_USER=$name" >> $env:GITHUB_ENV
          "N10_E2E_OTHER_PASSWORD=$password" >> $env:GITHUB_ENV

      - run: npx nx e2e:windows desktop-e2e

      - name: Remove the second local account
        if: always()
        shell: pwsh
        run: |
          $name = $env:N10_E2E_OTHER_USER
          if (-not $name) { exit 0 }
          Get-Process -IncludeUserName |
            Where-Object { $_.UserName -like "*\$name" } |
            Stop-Process -Force -ErrorAction SilentlyContinue
          $sid = (Get-LocalUser -Name $name).SID.Value
          Get-CimInstance Win32_UserProfile |
            Where-Object { $_.SID -eq $sid } |
            Remove-CimInstance
          Remove-LocalUser -Name $name

      - name: Upload Playwright test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-output
          path: apps/desktop-e2e/test-output/windows
          if-no-files-found: ignore
          retention-days: 7

  # The flake builds from package-lock.json's resolved URLs and integrity
  # hashes alone, so this also fails when a locked package lacks either.
  # nixpkgs' packages come from cache.nixos.org.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - run: nix build -L

      - run: ./result/bin/n10 --version
