name: Bug
description: Report something that doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: Include the steps that reproduce it.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected outcome
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Acceptance criteria
      description: The checks that tell us it's fixed, if you know them.
      placeholder: |
        - [ ] ...
  - type: input
    attributes:
      label: n10 version
      description: The output of `n10 --version`.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: App
      options:
        - n10 Desktop
        - TUI (n10 --tui)
    validations:
      required: true
  - type: input
    attributes:
      label: OS
      placeholder: Ubuntu 24.04, macOS 15.3
    validations:
      required: true
  - type: input
    attributes:
      label: Terminal
      description: Terminal emulator and tmux version (`tmux -V`), if relevant.
      placeholder: Ghostty 1.2, tmux 3.4
  - type: input
    attributes:
      label: Agent and provider
      description: Coding agent and version, and GitHub or Azure DevOps.
      placeholder: Claude Code 2.1, GitHub
  - type: textarea
    attributes:
      label: Logs
      description: >-
        Run n10 with `N10_LOG=/tmp/n10.log N10_LOG_LEVEL=debug`, reproduce the
        bug and paste the relevant lines. Remove anything private first.
      render: text
